name: Prisma Migration Validation

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  validate-migrations:
    runs-on: windows-latest
    strategy:
      matrix:
        node-version: [20]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Validate Prisma schema
        run: |
          npx prisma validate

      - name: Generate Prisma client
        run: |
          npx prisma generate

      # `--from-step` / `--to-step` do not exist in the Prisma CLI; compare the
      # empty datamodel with the schema instead so the step still proves the
      # schema renders a valid migration script.
      - name: Render schema migration script
        run: |
          npx prisma migrate diff --from-empty --to-schema-datamodel prisma/schema.prisma --script > /dev/null

      - name: Run test scenarios
        run: |
          npm run test:scenarios

      - name: Report success
        if: success()
        run: echo "✅ All Prisma migration validations passed"

      - name: Report failure
        if: failure()
        run: echo "❌ Prisma migration validation failed" && exit 1